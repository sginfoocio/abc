services:
  abcd-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${ABCD_IMAGE_REF:-abcd-control:local}
    container_name: abcd-control
    ports:
      - "8501:8501"
    environment:
      # Configuración de Base de Datos (desde .env)
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - APP_USERNAME=${APP_USERNAME}
      - APP_PASSWORD=${APP_PASSWORD}
      - MASTERDATA_USERNAME=${MASTERDATA_USERNAME}
      - MASTERDATA_PASSWORD=${MASTERDATA_PASSWORD}

      # Microsoft 365 / Graph API (envío de alertas y descarga Luxoptica)
      - M365_TENANT_ID=${M365_TENANT_ID}
      - M365_CLIENT_ID=${M365_CLIENT_ID}
      - M365_CLIENT_SECRET=${M365_CLIENT_SECRET}
      - M365_MAILBOX=${M365_MAILBOX}
      - M365_DOWNLOAD_ROOT=${M365_DOWNLOAD_ROOT:-/app/repo/images}
      - MASTERDATA_DICTIONARY_PATH=${MASTERDATA_DICTIONARY_PATH:-/app/data/masterdata_dictionary.json}

      # Alerta de pedidos vigilados
      - ALERT_RECIPIENT_EMAIL=${ALERT_RECIPIENT_EMAIL}
      - ORDER_ALERT_STATE_PATH=${ORDER_ALERT_STATE_PATH:-/app/data/order_alerts.sqlite3}
      - AUTH_REMEMBER_DAYS=${AUTH_REMEMBER_DAYS}
      - AUTH_COOKIE_SECRET=${AUTH_COOKIE_SECRET}
      - AUTH_STATE_PATH=${AUTH_STATE_PATH:-/app/data/auth_state.sqlite3}

      # Luxoptica (subida/descarga automática)
      - LUXOPTICA_URL=${LUXOPTICA_URL}
      - LUXOPTICA_USERNAME=${LUXOPTICA_USERNAME}
      - LUXOPTICA_PASSWORD=${LUXOPTICA_PASSWORD}
      - LUXOPTICA_REQUEST_EMAIL=${LUXOPTICA_REQUEST_EMAIL}

      # Configuración de Streamlit
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION=true
      - STREAMLIT_LOGGER_LEVEL=info
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Madrid
    
    # Volúmenes para desarrollo (comentar en producción)
    # volumes:
    #   - .:/app
    volumes:
      - ./watchlist_clientes.json:/app/watchlist_clientes.json
      - ./alerta_pedidos_notificados.json:/app/alerta_pedidos_notificados.json
      - ./masterdata_data:/app/data
      - ./repo/images:/app/repo/images
      - ./luxoptica_data:/app/docs/Luxoptica
    
    # Restart policy
    restart: unless-stopped
    
    # Límites de recursos
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    
    # Logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Red
    networks:
      - abcd-network

  abcd-luxoptica-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${ABCD_IMAGE_REF:-abcd-control:local}
    container_name: abcd-luxoptica-monitor
    command: ["python", "poll_luxoptica_mail.py", "--interval-minutes", "10", "--sender-hint", "luxottica", "--subject-hint", "image", "--lookback-days", "30", "--top-messages", "100"]
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - M365_TENANT_ID=${M365_TENANT_ID}
      - M365_CLIENT_ID=${M365_CLIENT_ID}
      - M365_CLIENT_SECRET=${M365_CLIENT_SECRET}
      - M365_MAILBOX=${M365_MAILBOX}
      - M365_DOWNLOAD_ROOT=${M365_DOWNLOAD_ROOT:-/app/repo/images}
      - MASTERDATA_DICTIONARY_PATH=${MASTERDATA_DICTIONARY_PATH:-/app/data/masterdata_dictionary.json}
      - TZ=Europe/Madrid
      - PYTHONUNBUFFERED=1
    volumes:
      - ./masterdata_data:/app/data
      - ./repo/images:/app/repo/images
      - ./luxoptica_data:/app/docs/Luxoptica
    restart: unless-stopped
    healthcheck:
      disable: true
    networks:
      - abcd-network

networks:
  abcd-network:
    driver: bridge
