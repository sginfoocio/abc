services:
  abcd-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: abcd-control
    ports:
      - "8501:8501"
    environment:
      # Configuración de Base de Datos (desde .env)
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - APP_USERNAME=${APP_USERNAME}
      - APP_PASSWORD=${APP_PASSWORD}
      
      # Configuración de Streamlit
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION=true
      - STREAMLIT_LOGGER_LEVEL=info
      - PYTHONUNBUFFERED=1
    
    # Volúmenes para desarrollo (comentar en producción)
    # volumes:
    #   - .:/app
    volumes:
      - ./watchlist_clientes.json:/app/watchlist_clientes.json
      - ./alerta_pedidos_notificados.json:/app/alerta_pedidos_notificados.json
    
    # Restart policy
    restart: unless-stopped
    
    # Límites de recursos
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    
    # Logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Red
    networks:
      - abcd-network

networks:
  abcd-network:
    driver: bridge
