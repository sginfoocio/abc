# Staging only; no published ports, credentials or production data.
services:
  image-storage-staging:
    image: ${STAGING_IMAGE:?Set verified build artifact}
    user: "10001:10001"
    environment:
      HOME: /home/cloud-images
      IMAGE_REPOSITORY_ROOT: /staging/images
      IMAGE_REPOSITORY_NFS_SOURCE: 192.168.1.32:/volume1/cloud-imagenes-staging
      IMAGE_REPOSITORY_STATE_ROOT: /staging/state
      IMAGE_REPOSITORY_BACKUP_ROOT: /staging/backups
      IMAGE_REPOSITORY_BACKUP_NFS_SOURCE: 192.168.1.32:/volume1/cloud-migration-backups
      IMAGE_REPOSITORY_WORK_ROOT: /staging/backups/.work
      IMAGE_REPOSITORY_WORK_NFS_SOURCE: 192.168.1.32:/volume1/cloud-migration-backups
      IMAGE_REPOSITORY_WORK_MOUNT_ROOT: /staging/backups
      IMAGE_REPOSITORY_WORK_RESERVE_BYTES: "2147483648"
      GRAPH_IMAGE_MAX_ARCHIVE_BYTES: "8589934592"
    network_mode: none
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:size=536870912,mode=1777"]
    volumes:
      - type: bind
        source: /mnt/cloud-imagenes-staging
        target: /staging/images
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/cloud-migration-backups
        target: /staging/backups
        bind:
          create_host_path: false
      - type: bind
        source: /opt/cloud-image-staging/state
        target: /staging/state
        bind:
          create_host_path: false
      - type: bind
        source: /opt/cloud-image-staging/source
        target: /staging/source
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/cloud-migration-recovery
        target: /staging/recovery
        bind:
          create_host_path: false
    command: ["python", "-c", "from image_repository import ImageRepository; r=ImageRepository(); print('Staging storage gates passed')"]
