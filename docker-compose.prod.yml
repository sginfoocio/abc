# Versión para Producción
# Uso: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  abcd-app:
    # En producción, usar imagen específica por versión
    image: registry.diagonaleyewear.net/abcd-control:latest
    
    # Restart automático
    restart: always
    
    # Límites más estrictos en producción
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G
    
    # Logs centralizados
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
        labels: "service=abcd-control"
    
    # Security
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    
    # Tmpfs para Streamlit
    tmpfs:
      - /tmp
      - /root/.streamlit

    # Persistencia de la lista de vigilancia y del registro de alertas ya enviadas
    # (el resto del filesystem es read_only)
    volumes:
      - ./watchlist_clientes.json:/app/watchlist_clientes.json
      - ./alerta_pedidos_notificados.json:/app/alerta_pedidos_notificados.json

  # Opcional: Reverse proxy Nginx integrado
