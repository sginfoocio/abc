<VirtualHost *:80>
    ServerName abcd.cloud.diagonaleyewear.net
    ServerAlias abcd.diagonaleyewear.net
    
    # Redirigir HTTP a HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
    
    # Let's Encrypt
    DocumentRoot /var/www/abcd.cloud.diagonaleyewear.net/acme-challenge
    <Directory /var/www/abcd.cloud.diagonaleyewear.net/acme-challenge>
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:443>
    ServerName abcd.cloud.diagonaleyewear.net
    ServerAlias abcd.diagonaleyewear.net
    
    # ========== SSL/TLS ==========
    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384'
    SSLHonorCipherOrder on
    SSLCompression off
    
    # Certificados Let's Encrypt (ISPConfig los maneja automáticamente)
    SSLCertificateFile /etc/letsencrypt/live/abcd.cloud.diagonaleyewear.net/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/abcd.cloud.diagonaleyewear.net/privkey.pem
    SSLCertificateChainFile /etc/letsencrypt/live/abcd.cloud.diagonaleyewear.net/chain.pem
    
    # HSTS
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
    
    # ========== Seguridad ==========
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "no-referrer-when-downgrade"
    Header always set Content-Security-Policy "default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline';"
    
    # ========== Compresión ==========
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/plain
        AddOutputFilterByType DEFLATE text/html
        AddOutputFilterByType DEFLATE text/xml
        AddOutputFilterByType DEFLATE text/css
        AddOutputFilterByType DEFLATE text/javascript
        AddOutputFilterByType DEFLATE application/xml
        AddOutputFilterByType DEFLATE application/xhtml+xml
        AddOutputFilterByType DEFLATE application/rss+xml
        AddOutputFilterByType DEFLATE application/javascript
        AddOutputFilterByType DEFLATE application/x-javascript
        AddOutputFilterByType DEFLATE application/json
    </IfModule>
    
    # ========== Logs ==========
    ErrorLog ${APACHE_LOG_DIR}/abcd.cloud.diagonaleyewear.net-error.log
    CustomLog ${APACHE_LOG_DIR}/abcd.cloud.diagonaleyewear.net-access.log combined
    LogLevel warn
    
    # ========== Proxy Inverso para Docker ==========
    ProxyPreserveHost On
    ProxyRequests Off
    
    # WebSocket support
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/(.*)$ "ws://127.0.0.1:8501/$1" [P,L]
    
    # Ruta principal (HTTP proxy)
    <Location />
        ProxyPass http://127.0.0.1:8501/
        ProxyPassReverse http://127.0.0.1:8501/
        
        # Headers para proxy
        ProxyAddHeaders On
        RequestHeader set X-Real-IP %{REMOTE_ADDR}s
        RequestHeader set X-Forwarded-For %{REMOTE_ADDR}s
        RequestHeader set X-Forwarded-Proto https
        RequestHeader set X-Forwarded-Host %{HTTP_HOST}s
        RequestHeader set X-Forwarded-Port 443
        
        # Timeouts largos para Streamlit
        ProxyPass timeout=3600
        
        # Sin buffer para streaming
        SetEnv proxy-sendchunked=1
    </Location>
    
    # WebSocket stream específico
    <Location /_stcore/stream>
        ProxyPass ws://127.0.0.1:8501/_stcore/stream
        ProxyPassReverse ws://127.0.0.1:8501/_stcore/stream
        ProxyAddHeaders On
        RequestHeader set X-Real-IP %{REMOTE_ADDR}s
        RequestHeader set X-Forwarded-For %{REMOTE_ADDR}s
        RequestHeader set X-Forwarded-Proto https
        
        SetEnv proxy-sendchunked=1
        ProxyPass timeout=3600
    </Location>
    
    # Health check endpoint
    <Location /health>
        ProxyPass http://127.0.0.1:8501/_stcore/health
        ProxyPassReverse http://127.0.0.1:8501/_stcore/health
        ProxyAddHeaders On
    </Location>
    
    # ========== Límites de Upload ==========
    LimitRequestBody 209715200
    
    # ========== Rate Limiting (mod_ratelimit) ==========
    <Location />
        SetOutputFilter RATE_LIMIT
        # 10 MB/s máximo
        Header set X-RateLimit-Limit "10000000"
    </Location>
    
    # ========== Denegar acceso a archivos sensibles ==========
    <FilesMatch "^\.|\.env">
        Require all denied
    </FilesMatch>
    
    # ========== Cache ==========
    <FilesMatch "\.(jpg|jpeg|gif|css|png|js|ico|eot|svg|ttf|woff|woff2)$">
        Header set Cache-Control "public, max-age=604800"
    </FilesMatch>
    
    # DocumentRoot (requerido por Apache)
    DocumentRoot /var/www/abcd.cloud.diagonaleyewear.net
    <Directory /var/www/abcd.cloud.diagonaleyewear.net>
        Require all granted
    </Directory>
</VirtualHost>
