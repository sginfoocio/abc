name: Deploy to Production

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: abcd-control-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate Secrets
        run: |
          if [ -z "${{ secrets.SERVER_HOST }}" ]; then
            echo "❌ ERROR: SERVER_HOST secret no configurado"
            exit 1
          fi
          if [ -z "${{ secrets.SERVER_USER }}" ]; then
            echo "❌ ERROR: SERVER_USER secret no configurado"
            exit 1
          fi
          if [ -z "${{ secrets.SERVER_PORT }}" ]; then
            echo "❌ ERROR: SERVER_PORT secret no configurado"
            exit 1
          fi
          if [ -z "${{ secrets.SERVER_SSH_KEY }}" ]; then
            echo "❌ ERROR: SERVER_SSH_KEY secret no configurado"
            exit 1
          fi
          echo "✅ Todos los secrets están configurados"

      - name: Deploy to Server
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: GH_TOKEN
          script: |
            set -e
            echo "🚀 Iniciando deploy desde GitHub Actions..."
            cd /opt/abcd-control
            echo "📁 Directorio: $(pwd)"

            echo "📥 Actualizando código..."
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/diagonaleyewear/abc.git"
            git fetch origin main
            git reset --hard origin/main
            echo "✅ Código actualizado"

            echo "🔨 Construyendo imagen Docker..."
            docker compose build --no-cache

            echo "⏹️  Deteniendo contenedor actual..."
            docker compose down --timeout 30

            echo "⏳ Esperando eliminación completa del contenedor..."
            for attempt in $(seq 1 30); do
              if ! docker ps -a --format '{{.Names}}' | grep -qx 'abcd-control'; then
                echo "✅ Contenedor eliminado"
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                echo "❌ El contenedor abcd-control sigue en eliminación tras 30 intentos"
                docker ps -a --filter name=abcd-control
                exit 1
              fi
              sleep 1
            done

            echo "▶️  Iniciando nuevo contenedor..."
            docker compose up -d

            echo "✅ Deploy completado exitosamente"

  tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8

      - name: Lint with flake8
        run: |
          flake8 app_enhanced.py db_loader.py engine.py --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app_enhanced.py db_loader.py engine.py --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Check syntax
        run: |
          python -m py_compile app_enhanced.py
          python -m py_compile db_loader.py
          python -m py_compile engine.py
