name: Deploy to Production

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
      - 'copilot/**'

concurrency:
  group: abcd-control-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate Secrets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -z "${{ secrets.SERVER_HOST }}" ]; then
            echo "❌ ERROR: SERVER_HOST secret no configurado"
            exit 1
          fi
          if [ -z "${{ secrets.SERVER_USER }}" ]; then
            echo "❌ ERROR: SERVER_USER secret no configurado"
            exit 1
          fi
          if [ -z "${{ secrets.SERVER_PORT }}" ]; then
            echo "❌ ERROR: SERVER_PORT secret no configurado"
            exit 1
          fi
          if [ -z "${{ secrets.SERVER_SSH_KEY }}" ]; then
            echo "❌ ERROR: SERVER_SSH_KEY secret no configurado"
            exit 1
          fi
          echo "✅ Todos los secrets están configurados"

      - name: Deploy to Server
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: GH_TOKEN
          script: |
            set -euo pipefail
            echo "🚀 Iniciando deploy desde GitHub Actions..."
            cd /opt/abcd-control
            echo "📁 Directorio: $(pwd)"

            echo "📥 Actualizando código..."
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
            git fetch origin "${{ github.sha }}"
            git reset --hard "${{ github.sha }}"
            echo "✅ Código actualizado"

            IMAGE_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}"
            echo "📥 Descargando imagen verificada: ${IMAGE_REF}"
            echo "${GH_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker pull "${IMAGE_REF}"

            PREVIOUS_REF=""
            PREVIOUS_IMAGE_ID="$(docker inspect --format='{{.Image}}' abcd-control 2>/dev/null || true)"
            if [ -n "${PREVIOUS_IMAGE_ID}" ]; then
              PREVIOUS_REF="abcd-control:rollback-${{ github.sha }}"
              docker image tag "${PREVIOUS_IMAGE_ID}" "${PREVIOUS_REF}"
              echo "💾 Imagen previa preservada como ${PREVIOUS_REF}"
            fi

            echo "▶️  Actualizando servicios y esperando salud..."
            if ! ABCD_IMAGE_REF="${IMAGE_REF}" docker compose up -d --no-build --wait --wait-timeout 180; then
              echo "❌ La nueva revisión no llegó a estado healthy"
              if [ -n "${PREVIOUS_REF}" ]; then
                echo "↩️  Restaurando la imagen anterior"
                ABCD_IMAGE_REF="${PREVIOUS_REF}" docker compose up -d --no-build --wait --wait-timeout 180 || {
                  echo "❌ Falló también el rollback; requiere intervención manual"
                  exit 1
                }
                echo "✅ Rollback completado"
              else
                echo "❌ No había contenedor anterior para restaurar"
              fi
              exit 1
            fi

            printf '%s\n' "${IMAGE_REF}" > .last-deployed-image.tmp
            mv .last-deployed-image.tmp .last-deployed-image
            echo "✅ Imagen desplegada y healthy: ${IMAGE_REF}"

            echo "🗓️  Programando foto semanal ABCD..."
            mkdir -p /opt/abcd-control/logs
            SNAPSHOT_CRON="0 6 * * 1 cd /opt/abcd-control && docker compose exec -T abcd-app python save_abcd_weekly_snapshot.py >> /opt/abcd-control/logs/abcd-weekly-snapshot.log 2>&1 # ABCD weekly snapshot"
            if command -v crontab >/dev/null 2>&1; then
              (crontab -l 2>/dev/null | grep -v 'ABCD weekly snapshot'; echo "$SNAPSHOT_CRON") | crontab -
              echo "✅ Cron semanal configurado: lunes 06:00"
            else
              echo "⚠️  crontab no está disponible en el servidor; configura manualmente: $SNAPSHOT_CRON"
            fi

            echo "✅ Deploy completado exitosamente"

  tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv==0.12.22
          pip install -r requirements-dev.txt

      - name: Verify dependency locks
        run: |
          uv pip compile requirements.in --python-version 3.11 --python-platform x86_64-unknown-linux-gnu --custom-compile-command "uv pip compile requirements.in --python-version 3.11 --python-platform x86_64-unknown-linux-gnu" -o /tmp/requirements.txt
          uv pip compile requirements-dev.in --python-version 3.11 --python-platform x86_64-unknown-linux-gnu --custom-compile-command "uv pip compile requirements-dev.in --python-version 3.11 --python-platform x86_64-unknown-linux-gnu" -o /tmp/requirements-dev.txt
          diff -u requirements.txt /tmp/requirements.txt
          diff -u requirements-dev.txt /tmp/requirements-dev.txt

      - name: Run offline tests
        run: python -m pytest -q tests test_transform_luxottica_masterdata.py test_validate_masterdata_odoo_dryrun.py

      - name: Lint with flake8
        run: |
          flake8 app_enhanced.py db_loader.py engine.py abcd_snapshots.py save_abcd_weekly_snapshot.py auth_session.py order_alerts.py graph_mail_downloader.py tests/test_abcd_snapshots.py tests/test_auth_session.py tests/test_order_alerts.py tests/test_graph_mail_downloader.py --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app_enhanced.py db_loader.py engine.py abcd_snapshots.py save_abcd_weekly_snapshot.py auth_session.py order_alerts.py graph_mail_downloader.py tests/test_abcd_snapshots.py tests/test_auth_session.py tests/test_order_alerts.py tests/test_graph_mail_downloader.py --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Check syntax
        run: |
          python -m py_compile app_enhanced.py
          python -m py_compile db_loader.py
          python -m py_compile engine.py
          python -m py_compile abcd_snapshots.py
          python -m py_compile save_abcd_weekly_snapshot.py
          python -m py_compile auth_session.py
          python -m py_compile order_alerts.py
          python -m py_compile graph_mail_downloader.py
