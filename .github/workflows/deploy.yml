name: Deploy to Production

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate Secrets
        run: |
          if [ -z "${{ secrets.SERVER_HOST }}" ]; then
            echo "❌ ERROR: SERVER_HOST secret no configurado"
            exit 1
          fi
          if [ -z "${{ secrets.SERVER_USER }}" ]; then
            echo "❌ ERROR: SERVER_USER secret no configurado"
            exit 1
          fi
          if [ -z "${{ secrets.SERVER_PORT }}" ]; then
            echo "❌ ERROR: SERVER_PORT secret no configurado"
            exit 1
          fi
          if [ -z "${{ secrets.SERVER_SSH_KEY }}" ]; then
            echo "❌ ERROR: SERVER_SSH_KEY secret no configurado"
            exit 1
          fi
          echo "✅ Todos los secrets están configurados"

      - name: Copy code to server
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "*.py,requirements.txt,Dockerfile,docker-compose.yml,docker-compose.prod.yml,.github"
          target: /opt/abcd-control
          strip_components: 0
          overwrite: true

      - name: Deploy to Server
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            DEPLOY_DIR="/opt/abcd-control"
            LOG_DIR="$DEPLOY_DIR/logs"
            LOG_FILE="$LOG_DIR/abcd-deploy.log"
            mkdir -p "$LOG_DIR"

            log() { echo "[$(date '+%Y-%m-%d %H:%M:%S')] $1" | tee -a "$LOG_FILE"; }

            log "🚀 Iniciando deploy desde GitHub Actions..."
            cd "$DEPLOY_DIR"
            log "📁 Directorio: $(pwd)"

            if [ ! -f .env ]; then
              log "❌ Archivo .env no encontrado"
              exit 1
            fi

            log "🔨 Construyendo imagen Docker..."
            docker compose build --no-cache >> "$LOG_FILE" 2>&1
            log "✅ Build completado"

            log "⏹️  Deteniendo contenedor actual..."
            docker compose down >> "$LOG_FILE" 2>&1
            sleep 2

            log "▶️  Iniciando nuevo contenedor..."
            docker compose up -d >> "$LOG_FILE" 2>&1
            log "✅ Contenedor iniciado"

            log "⏳ Esperando health check..."
            sleep 8
            attempt=0
            while [ $attempt -lt 10 ]; do
              if docker compose exec -T abcd-app curl -s http://localhost:8501/_stcore/health > /dev/null 2>&1; then
                log "✅ Health check OK"
                break
              fi
              attempt=$((attempt + 1))
              sleep 3
            done

            docker image prune -f >> "$LOG_FILE" 2>&1
            log "✨ Deploy completado exitosamente"

  tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8

      - name: Lint with flake8
        run: |
          flake8 app_enhanced.py db_loader.py engine.py --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app_enhanced.py db_loader.py engine.py --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Check syntax
        run: |
          python -m py_compile app_enhanced.py
          python -m py_compile db_loader.py
          python -m py_compile engine.py
