# Configuración Nginx para ABCD Control
# Ubicación en servidor: /etc/nginx/sites-available/abcd.diagonaleyewear.net
# O en Docker: ./nginx.conf para usar en volumen

upstream streamlit_backend {
    server abcd-app:8501;
    keepalive 32;
}

# Rate limiting
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

# Redireccionar HTTP a HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name abcd.cloud.diagonaleyewear.net;
    
    location /.well-known/acme-challenge/ {
        # Para Let's Encrypt
        root /var/www/certbot;
    }
    
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    
    server_name abcd.cloud.diagonaleyewear.net;
    
    # ==== SSL/TLS ====
    # Certificados Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/abcd.cloud.diagonaleyewear.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/abcd.cloud.diagonaleyewear.net/privkey.pem;
    
    # Configuración SSL moderna
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    
    # HSTS (HTTP Strict Transport Security)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # ==== Seguridad ====
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline';" always;
    
    # ==== Logs ====
    access_log /var/log/nginx/abcd.access.log combined buffer=32k;
    error_log /var/log/nginx/abcd.error.log warn;
    
    # ==== Optimización ====
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss;
    gzip_disable "msie6";
    
    # Tamaño de upload
    client_max_body_size 200M;
    client_body_buffer_size 10M;
    
    # Timeouts
    client_body_timeout 60s;
    client_header_timeout 60s;
    keepalive_timeout 65s;
    send_timeout 60s;
    
    # ==== Rate Limiting ====
    limit_req zone=general burst=20 nodelay;
    
    # ==== Rutas ====
    
    # Ruta principal
    location / {
        proxy_pass http://streamlit_backend;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts largos para Streamlit
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 86400s;
        
        # Buffer
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        
        # Keep alive
        proxy_set_header Connection "";
        proxy_http_version 1.1;
    }
    
    # WebSocket stream específicamente
    location /_stcore/stream {
        proxy_pass http://streamlit_backend/_stcore/stream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Sin buffer para streaming
        proxy_buffering off;
        proxy_request_buffering off;
        
        # Timeouts largos
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 86400s;
    }
    
    # Health check endpoint
    location /health {
        proxy_pass http://streamlit_backend/_stcore/health;
        proxy_set_header Host $host;
        access_log off;
    }
    
    # Denegar acceso a archivos sensibles
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    location ~ /\.env {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Servir archivos estáticos (si existen)
    location ~* ^.+\.(jpg|jpeg|gif|css|png|js|ico|eot|svg|ttf|woff|woff2)$ {
        proxy_pass http://streamlit_backend;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}

# Redirigir otros dominios a principal
server {
    listen 80;
    listen [::]:80;
    server_name _;
    
    location / {
        return 301 https://abcd.cloud.diagonaleyewear.net;
    }
}

